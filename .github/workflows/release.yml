name: Build and release

# Every push to main: if Source/Info.plist has a version that is not released
# yet, build a universal app on a GitHub Mac, run the tests and publish
# Notch-Island-v<version>.zip as a release. Notch Island picks it up itself.
on:
  push:
    branches: [main]
    # Ovira for Windows has its own workflow (windows.yml).
    paths-ignore: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (fallback when macos-26 has no capacity)'
        default: 'macos-26'
      check:
        description: 'yes = only test and build (compile check), never publish'
        default: 'no'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Source/Info.plist)" >> "$GITHUB_OUTPUT"

      # 4.6.2: with the RELEASES_TOKEN secret, builds are published to the
      # public H1rka-afk/notch-island-releases (no source code there), so
      # this repository can be private. Without it — here, as before.
      - name: Where to publish
        id: target
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then
            echo "repo=H1rka-afk/notch-island-releases" >> "$GITHUB_OUTPUT"
            echo "external=1" >> "$GITHUB_OUTPUT"
          else
            echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" -R "${{ steps.target.outputs.repo }}" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already released"
          fi

      - name: Newest Xcode
        if: steps.exists.outputs.skip != '1' || inputs.check == 'yes'
        run: |
          ls -d /Applications/Xcode*.app || true
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Tests
        if: steps.exists.outputs.skip != '1' || inputs.check == 'yes'
        run: bash scripts/run-tests.sh

      - name: Build
        if: steps.exists.outputs.skip != '1' || inputs.check == 'yes'
        run: bash scripts/ci-build.sh

      - name: Publish release
        if: steps.exists.outputs.skip != '1' && inputs.check != 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" "build/Notch-Island-v$V.zip" -R "${{ steps.target.outputs.repo }}" \
            --title "Notch Island $V" --notes-file CHANGES.txt --latest
